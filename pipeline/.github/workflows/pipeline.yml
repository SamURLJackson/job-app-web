name: Job Agent Pipeline

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Supabase pipeline run ID'
        required: true
      user_id:
        description: 'Supabase user ID'
        required: true
      job_titles:
        description: 'Comma-separated job titles'
        required: true
      salary_floor:
        description: 'Minimum salary'
        required: true
        default: '110000'
      score_threshold:
        description: 'Minimum score (1-10)'
        required: true
        default: '7'
      location:
        description: 'Base location'
        required: false
        default: ''
      location_radius:
        description: 'Radius in miles'
        required: false
        default: '50'
      remote_only:
        description: 'Remote/hybrid only'
        required: false
        default: 'true'
      your_name:
        description: 'Applicant full name'
        required: true
      your_email:
        description: 'Applicant email'
        required: true
      skills_text:
        description: 'Skills for matching'
        required: false
        default: ''
      resume_url:
        description: 'Signed URL to resume PDF'
        required: false
        default: ''
      resume_filename:
        description: 'Resume filename'
        required: false
        default: 'resume.pdf'
      callback_url:
        description: 'Vercel callback URL'
        required: true
      webhook_secret:
        description: 'Webhook auth secret'
        required: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pipeline/package-lock.json

      - name: Install dependencies
        working-directory: pipeline
        run: npm ci

      - name: Download resume
        if: ${{ inputs.resume_url != '' }}
        working-directory: pipeline
        run: |
          mkdir -p data
          curl -L "${{ inputs.resume_url }}" -o "data/${{ inputs.resume_filename }}"

      - name: Run pipeline
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_API_TOKEN:    ${{ secrets.APIFY_API_TOKEN }}
          APIFY_INDEED_ACTOR_ID:  ${{ secrets.APIFY_INDEED_ACTOR_ID }}
          APIFY_BUILTIN_ACTOR_ID: ${{ secrets.APIFY_BUILTIN_ACTOR_ID }}
          APIFY_LINKEDIN_ACTOR_ID: ${{ secrets.APIFY_LINKEDIN_ACTOR_ID }}
          APIFY_DICE_ACTOR_ID:    ${{ secrets.APIFY_DICE_ACTOR_ID }}
          # Passed from workflow inputs
          RUN_ID:           ${{ inputs.run_id }}
          USER_ID:          ${{ inputs.user_id }}
          JOB_TITLES:       ${{ inputs.job_titles }}
          SALARY_FLOOR:     ${{ inputs.salary_floor }}
          SCORE_THRESHOLD:  ${{ inputs.score_threshold }}
          LOCATION:         ${{ inputs.location }}
          LOCATION_RADIUS:  ${{ inputs.location_radius }}
          REMOTE_ONLY:      ${{ inputs.remote_only }}
          YOUR_NAME:        ${{ inputs.your_name }}
          YOUR_EMAIL:       ${{ inputs.your_email }}
          SKILLS_TEXT:      ${{ inputs.skills_text }}
          RESUME_PATH:      ./data/resume.txt
          RESUME_FILENAME:  ${{ inputs.resume_filename }}
          CALLBACK_URL:     ${{ inputs.callback_url }}
          WEBHOOK_SECRET:   ${{ inputs.webhook_secret }}
        run: node index.js --now
